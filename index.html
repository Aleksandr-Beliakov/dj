  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    overflow-x: hidden;
    font-family: "Montserrat", sans-serif;
  }

  /* ===== Hero ===== */
  .hero {
    position: relative;
    width: 100%;
    line-height: 0;
  }
  .hero img {
    display: block;
    width: 100%;
    height: auto;
  }
  .hero-text {
    position: absolute;
    left: 40px;

    font-weight: 400;

  }
  .hero-title {
    left: 31px;

  .hero-subtitle {

  }
  .hero-genre {
    top: 295px;
    font-size: 33px;

  }

  /* ===== Language switcher ===== */
  .lang-switch {
    position: absolute;
    top: 40px;
    right: 31px;
    z-index: 5;
    display: flex;
    gap: 8px;
  }
  .lang-switch button {
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    min-height: 40px;
    padding: 0 14px;
    margin: 0;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 2px;
    color: #fff;
    font-family: "Montserrat", sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
    cursor: pointer;
    transition: opacity 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
  }
  .lang-switch button:hover {
    opacity: 1;
    border-color: #fff;
    background: rgba(0, 0, 0, 0.55);
  }
  .lang-switch button:focus-visible {
    opacity: 1;
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .lang-switch button[hidden] {
    display: none;
  }

  /* ===== Price grid ===== */
  .price-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    width: 100%;
  }
  .price-col {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 400px;
    padding: 28px 20px;
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
  }
  .price-col--basic    { background-image: url("assets/img/tariff-basic.jpg"); }
  .price-col--standard { background-image: url("assets/img/tariff-standard.jpg"); }
  .price-col--premium  { background-image: url("assets/img/tariff-premium.jpg"); }
  .price-col h2 {
    margin: 0;
    color: #fff;
    font-size: 25px;
    font-weight: 500;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
  }
  .price-col .price {
    margin: 0;
    color: #fff;
    font-size: 34px;
    font-weight: 600;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
  }
  .price-col .condition {
    margin: 0;
    color: #fff;
    font-size: 16px;
    font-weight: 300;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
  }

  /* ===== Footer image + social icons ===== */
  .footer {
    position: relative;
    width: 100%;
    line-height: 0;
  }
  .footer-img {
    display: block;
    width: 100%;
    height: auto;
  }
  .social-row {
    position: absolute;
    top: 11%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5%;
    width: 90%;
  }
  .social-row a {
    display: flex;
    width: 8%;
    max-width: 58px;
    min-width: 28px;
    aspect-ratio: 1 / 1;
    opacity: 0.92;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .social-row a:hover {
    opacity: 1;
    transform: translateY(-3px);
  }
  .social-row a img {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ===== Mobile ===== */
  @media (max-width: 767px) {
    .hero-title {
      left: 11.953px;
      top: 25px;
      font-size: 37px;
    }
    .hero-subtitle {
      left: 15.888px;
      top: 74px;
      font-size: 15px;
    }
    .hero-genre {
      left: 81.865px;
      top: 281.923px;
      font-size: 16px;
    }
    .lang-switch {
      top: 10px;
      right: 12px;
      gap: 6px;
    }
    .lang-switch button {
      font-size: 11px;
      padding: 0 10px;
    }
    .price-grid {
      grid-template-columns: 1fr;
    }
    .price-col {
      min-height: 450px;
    }
    .social-row a {
      max-width: 40px;
    }
  }
</style>
